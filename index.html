<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website with Logo</title>
  <style>
    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background: #f9f9f9;
    }
    .logo img {
      height: 60px; /* Adjust size of logo */
      width: auto;
    }
  </style>
</head>
<body>
  <header>
    <!-- Logo with link to homepage -->
    <a href="index.html" class="logo">
      <img src="logo.png" alt="My Website Logo">
    </a>
  </header>
</body>
</html>
